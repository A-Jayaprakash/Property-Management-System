services:
  - type: web
    name: property-management-system
    env: node
    buildCommand: npm install
    startCommand: node backend/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
